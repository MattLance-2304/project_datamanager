services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rdms
      POSTGRES_PASSWORD: rdms
      POSTGRES_DB: rdms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdms -d rdms"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${RDMS_PORT:-8000}:8000"
    environment:
      RDMS_DATABASE_URL: postgresql+psycopg://rdms:rdms@db:5432/rdms
      # 生产环境务必修改为长随机字符串（>= 32 字符）
      RDMS_JWT_SECRET: please-change-me-to-a-long-random-string
      RDMS_TOKEN_EXPIRE_HOURS: "72"
      RDMS_BACKUP_DIR: /data/backup
      TZ: Asia/Shanghai
    volumes:
      - filestore:/data/files
      # 备份默认放独立卷；更推荐改为宿主机路径/NAS 挂载（与主数据不同物理盘更安全），例如：
      # - /mnt/nas-backup/rdms:/data/backup
      - backups:/data/backup

volumes:
  pgdata:
  filestore:
  backups:
